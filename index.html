<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Ableton-inspired Live Performance Synthesizer Workstation and DAW for Desktop and Android with ultra-low latency." />
  
  <!-- PWA & Mobile Capabilities -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2312141a'/><path d='M20 30h12v40H20zm16 0h12v40H36zm16 0h12v40H52zm16 0h12v40H68z' fill='%23ff764d'/></svg>" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#12141a" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/css/theme.css" />
  <link rel="stylesheet" href="/src/css/workstation.css" />
  <link rel="stylesheet" href="/src/css/triton.css" />
  <link rel="stylesheet" href="/src/css/fx-rack.css" />
  <link rel="stylesheet" href="/src/css/media-player.css" />
  <link rel="stylesheet" href="/src/css/keyboard.css" />
  <link rel="stylesheet" href="/src/css/light-app.css" />

  <style>
    /* Critical Form & Dropdown Fast Rendering / Zero White Flash */
    :root, html, body {
      color-scheme: dark !important;
      background-color: #12141a;
    }
    select, option, optgroup {
      color-scheme: dark !important;
      background-color: #141720 !important;
      color: #f1f5f9 !important;
      -webkit-appearance: none !important;
      -moz-appearance: none !important;
      appearance: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    /* Professional Startup Stage Boot Loader */
    .app-startup-loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #151821 0%, #0c0e13 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .app-startup-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 90%;
      max-width: 380px;
    }
    .loader-logo-ring {
      position: relative;
      width: 84px;
      height: 84px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader-brand-icon {
      filter: drop-shadow(0 0 16px rgba(255, 118, 77, 0.4));
      animation: pulseGlow 2.2s infinite ease-in-out;
    }
    .loader-spinner {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #ff764d;
      border-right-color: rgba(255, 118, 77, 0.3);
      animation: spinRing 1.1s linear infinite;
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1.0); filter: drop-shadow(0 0 14px rgba(255, 118, 77, 0.35)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 24px rgba(255, 118, 77, 0.7)); }
    }
    .loader-brand-name {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .loader-brand-name span {
      color: #ff764d;
    }
    .loader-subtitle {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    .loader-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }
    .loader-progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ea580c, #ff764d, #f59e0b);
      border-radius: 999px;
      animation: shimmerProgress 1.4s infinite ease-in-out;
      transform-origin: left;
    }
    @keyframes shimmerProgress {
      0% { transform: scaleX(0.15) translateX(-50%); }
      50% { transform: scaleX(0.85) translateX(10%); }
      100% { transform: scaleX(1.0) translateX(0%); }
    }
    .loader-status {
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      color: #64748b;
    }

    /* Audio Unlock Splash Overlay */
    .audio-unlock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .audio-unlock-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .unlock-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--accent-amber);
      box-shadow: 0 0 35px var(--accent-amber-glow);
      border-radius: var(--radius-lg);
      padding: 30px;
      text-align: center;
      max-width: 460px;
      width: 90%;
    }
    .unlock-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .unlock-title span { color: var(--accent-amber); }
    .unlock-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .unlock-btn {
      background: linear-gradient(135deg, var(--accent-amber), #ea580c);
      color: #000;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 1px;
      border: none;
      padding: 14px 28px;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 118, 77, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .unlock-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 118, 77, 0.6);
    }
  </style>
</head>
<body>
  <!-- Stage Boot Loader Screen -->
  <div id="app-startup-loader" class="app-startup-loader">
    <div class="loader-content">
      <div class="loader-logo-ring">
        <svg class="loader-brand-icon" viewBox="0 0 100 100" width="56" height="56">
          <rect width="100" height="100" rx="22" fill="#181b24" stroke="rgba(255,118,77,0.3)" stroke-width="2"/>
          <path d="M22 32h11v36H22zm15 0h11v36H37zm15 0h11v36H52zm15 0h11v36H67z" fill="#ff764d"/>
        </svg>
        <div class="loader-spinner"></div>
      </div>
      <div class="loader-brand-name"><span>WILSONIX</span> MIDIKEY</div>
      <div class="loader-subtitle">STAGE PERFORMANCE WORKSTATION</div>
      <div class="loader-progress-track">
        <div class="loader-progress-bar" id="loader-progress-bar"></div>
      </div>
      <div class="loader-status" id="loader-status-text">INITIALIZING ZERO-LATENCY DSP ENGINE...</div>
    </div>
  </div>

  <div id="app-root">
    <!-- Audio Unlock Splash (Auto-closed / transparent background unlock) -->
    <div class="audio-unlock-overlay hidden" id="audio-unlock-overlay" style="display: none;">
      <div class="unlock-card">
        <div class="unlock-title"><span>MIDI</span>KEY ELITE</div>
        <p class="unlock-desc">
          Ableton-Grade Performance Synthesizer & DAW.<br />
          Click below to arm the <strong>zero-delay audio pipeline</strong> and connect your USB MIDI or laptop keyboard.
        </p>
        <button class="unlock-btn" id="btn-engine-unlock">▶ INITIALIZE ZERO-LAG ENGINE</button>
      </div>
    </div>

    <!-- Main Viewport -->
    <main class="studio-main-viewport">
      <!-- 1. STAGE PERFORMANCE DECK: Strictly 100vh, zero scrolling required to choose sounds or play keys -->
      <div class="studio-stage-deck" id="studio-stage-deck">
        <!-- Top Pro Studio Performance Header -->
        <section id="gig-hud-mount"></section>

        <!-- Middle Workstation & Sound Engine Bay (Flex: 1, automatically fits available height) -->
        <div class="studio-workstation-bay" id="studio-workstation-bay">
          <!-- KORG TRITON Workstation Console -->
          <section id="triton-workstation-mount"></section>

          <!-- COMBI 4-Timbre Multi-Layer Console -->
          <section id="multi-layer-mount"></section>

          <!-- SPLIT KEYBOARD Console (dedicated view: assign lower/upper halves) -->
          <section id="split-console-mount"></section>

          <!-- ABLETON DEVICE FX RACK (Embedded in workstation bay - ZERO scrolling) -->
          <section id="fx-rack-mount"></section>

          <!-- Middle Grid: Chord Harmony Pads + Clip Looper -->
          <div class="workstation-middle-grid" id="middle-grid-section">
            <section class="chord-station-card" id="chord-pads-mount"></section>
            <section class="looper-station-card" id="looper-mount"></section>
          </div>

          <!-- DEMO STATION: 30s Interactive Song Clips -->
          <section id="demo-station-mount"></section>

          <!-- GROOVE & SFX STATION: Synchronized Backing Loops + Soundboard -->
          <section id="groove-station-mount"></section>

          <!-- MEDIA PLAYER DECK: Audio/Video Playback Station with Persistent Playlist -->
          <section id="media-player-mount"></section>
        </div>


        <!-- Bottom Performance Deck: Piano Keyboard Instrument (Always 100% visible, fully playable) -->
        <div class="studio-keyboard-deck" id="studio-keyboard-deck">
          <section id="virtual-keyboard-mount"></section>
        </div>
      </div>
    </main>

    <!-- Floating Non-Invasive License Pill Widget -->
    <button class="floating-license-pill" id="floating-license-btn" title="License Status & Activation">
      <span class="pill-dot"></span>
      <span class="pill-label" id="floating-license-label">★ PRO</span>
    </button>

    <!-- License Modal Mount -->
    <div id="license-modal-mount"></div>
  </div>

  <!-- Application Entry Point -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
