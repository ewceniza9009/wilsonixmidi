[package]
name = "wilsonix-midikey"
version = "2.2.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true

