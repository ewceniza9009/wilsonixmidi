    /* Audio Unlock Splash Overlay */
    .audio-unlock-overlay {
      position: fixed;

      backdrop-filter: blur(12px);

      flex-direction: column;
      align-items: center;

    .audio-unlock-overlay.hidden {

    .unlock-card {

    .unlock-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .unlock-title span { color: var(--accent-amber); }
    .unlock-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .unlock-btn {
